name: Comprobar cambios

on: [push, pull_request]

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check:js

  humo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar navegador fuera del proyecto
        run: |
          mkdir -p "$RUNNER_TEMP/humo"
          npm install --prefix "$RUNNER_TEMP/humo" --no-save --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/humo/node_modules/.bin/playwright" install --with-deps chromium
          cp ci/humo.cjs "$RUNNER_TEMP/humo/humo.cjs"
      - name: Comprobar interfaz sin red por file://
        run: node "$RUNNER_TEMP/humo/humo.cjs" "$GITHUB_WORKSPACE"
